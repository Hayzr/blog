<footer class="site-footer">
  <div class="wrapper footer-inner">
    <p class="footer-desc">{{ site.description | escape }}</p>
    <nav class="footer-links">
      <a class="footer-link" href="{{ "/feed.xml" | relative_url }}">RSS Feed</a>
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title -%}
        <a class="footer-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
    <p class="footer-copy">&copy; {{ site.time | date: "%Y" }} &middot; {{ site.title | escape }}</p>
  </div>
</footer>
